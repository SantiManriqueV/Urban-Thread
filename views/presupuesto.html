<!DOCTYPE html>
<!-- Creamos el documento HTML para la página de presupuesto de Urban Thread -->
<html lang="es">
<head>
    <!-- Definimos la codificación de caracteres y la configuración de la vista para dispositivos móviles -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Agregamos el título de la página destacando la sección actual -->
    <title>Urban thread-Presupuesto</title>
</head>
<body>
    <!-- Creamos el encabezado de la página con el logo de Urban Thread -->
    <header>
        <!-- Agregamos el logo de Urban Thread con la clase "logo" -->
        <h1><img src="../images/logo.png" alt="Logo de Urban Thread" class="logo"></h1>
    </header>
    <!-- Creamos la barra de navegación con enlaces a las diferentes secciones del sitio web -->
    <nav>
        <ul>
            <!-- Agregamos los enlaces del sitio web, destacando la sección actual con la clase "activo" -->
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="presupuesto.html" class="activo">Presupuesto</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    <main>
        <!-- Creamos un formulario para solicitar información con campos de entrada y un botón de envío -->
        <form action="#" method="post">
            <!-- Solicitamos el nombre completo -->
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <!-- Solicitamos el correo electrónico -->
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <!-- Solicitamos el teléfono con un patrón de validación para 9 dígitos -->
            <label for="telefono">Teléfono:</label>
            <!-- Agregamos un mensaje en caso de que el número no sea válido -->
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" title="Ingrese un número de teléfono válido de 9 dígitos" required>

            <!-- Solicitamos el mensaje o solicitud de presupuesto -->
            <label for="mensaje">Solicite mas información</label>
            <!-- Agregamos un área de texto para que el usuario pueda escribir su mensaje -->
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

            <!-- Agregamos un checkbox para aceptar la política de privacidad, que es obligatorio -->
            <label for="privacidad" class="check-label">
                <!-- Agregamos un enlace a la política de privacidad -->
                <input type="checkbox" id="privacidad" name="privacidad" required>
                Acepto la <a href="#">política de privacidad</a>.
            </label>

            <!-- Agregamos un botón de envío con la clase "boton" -->
            <button type="submit" class="boton">Enviar</button>
        </form>
        
    </main>
    <!-- Creamos el pie de página con enlaces a redes sociales y la dirección de la tienda -->
    <footer>
        <!--Por medio de una lista agregamos los enlaces a redes sociales -->
        <ul>
            <li>
                <a href="https://www.instagram.com/" aria-label="Instagram">
                    <!-- Agregamos el ícono de Instagram utilizando SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">

                    </svg>
                 </a>
            </li>
            <li>
                <a href="https://www.facebook.com/" aria-label="Facebook">
                    <!-- Agregamos el ícono de Facebook utilizando SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M22 12a10 10 0 10-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0022 12z"/>

            <li>
                <a href="https://x.com/" aria-label="X (Twitter)">

            </li>
        </ul>
        <p>Calle de la Madera, 1. Leganes, Madrid</p>
        <!-- Agregamos un mensaje de derechos reservados con el símbolo &copy; -->
        <p>&copy; 2026 Urban Thread. Todos los derechos reservados.</p>
    </footer>
</body> 
</html>
